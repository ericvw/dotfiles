# .kitty.conf — kitty terminal configuration
# vim: foldmethod=marker

#: Fonts {{{

# https://www.monolisa.dev/
font_family      MonoLisaCode
bold_font        MonoLisaCode SemiBold
italic_font      MonoLisaCode Italic
bold_italic_font MonoLisaCode SemiBold Italic
font_size        18.0

# cv07: Alt greater-equal with flat underline.
# ss13: Hexadecimal x for 0x#...
# ss12: Thin double backslash.
# ss01: Script variant glyphs.
font_features    MonoLisaCode-Regular         +dlig +cv07 +ss13 +ss12
font_features    MonoLisaCodeRegular-SemiBold +dlig +cv07 +ss13 +ss12
font_features    MonoLisaCode-Italic          +dlig +cv07 +ss13 +ss12 +ss01
font_features    MonoLisaCodeItalic-SemiBold  +dlig +cv07 +ss13 +ss12 +ss01

# Give breathing room betweek the text baseline and underline.
modify_font      underline_position 3

#: }}}

#: Cursor customization {{{

# Disable blinking — it is too distracting.
cursor_blink_interval 0

#: }}}

#: Color scheme {{{

# BEGIN_KITTY_THEME
# Kanagawa
include current-theme.conf
# END_KITTY_THEME

#: }}}

#: Advanced {{{

# Disable changing the cursor and let shell configuration handle that.
shell_integration no-cursor

#: }}}

#: OS specific tweaks {{{

# Allow passing through 'alt' to terminal applications.
macos_option_as_alt left

#: }}}

#: Keyboard shortcuts {{{

# Open windows with the same working directory as that of the active window.
map cmd+enter new_window_with_cwd
map kitty_mod+enter new_window_with_cwd

#: }}}
